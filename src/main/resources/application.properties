spring.application.name=SAE_S5_2026_Quizzard_Back

# Variables locales : un fichier .env à la racine (voir .env.example) est lu s'il existe.
spring.config.import=optional:file:.env[.properties]

# Base de données
# En développement, l'URL et les identifiants viennent de compose.yaml (spring-boot-docker-compose).
# Le schéma est créé et versionné par Flyway (src/main/resources/db/migration) ;
# Hibernate vérifie seulement que les entités correspondent aux tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Import de PDF : 50 Mo au plus (au-delà, 413)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Front React autorisé par CORS
quizzard.front.url=${FRONT_URL:http://localhost:5173}

# Logs en JSON Lines : un objet JSON par ligne, avec des noms de champs fixes (cours « Format des logs »)
logging.structured.format.console=logstash

# Pas d'utilisateur en mémoire au mot de passe généré : la connexion viendra de la feature compte.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
